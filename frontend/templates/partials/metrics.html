        <p class="text-3xl font-bold mt-1">{{ tickets | length }}</p>
    </div>
    <div class="bg-navy-800 rounded-lg p-4 border border-navy-700">

        <p class="text-3xl font-bold mt-1">{{ commits | length }}</p>

        <p class="text-3xl font-bold mt-1">{{ prs | length }}</p>
    </div>
    <div class="bg-navy-800 rounded-lg p-4 border border-navy-700">

        <p class="text-3xl font-bold mt-1">{{ events | length }}</p>

    <div class="bg-navy-800 rounded-lg p-4 border border-navy-700">
